<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEKIRU Classroom</title>
<style>
:root{--pink:#F48BA8;--green:#A8D08D;--orange:#FFB463;--blue:#8BB7E8;--purple:#B59AD9;--brown:#7A6E65;--ink:#554D48;--bg:#FAFAF8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic","Noto Sans JP",sans-serif}
header{height:84px;background:#fff;border-bottom:3px solid var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
header img{width:min(520px,55vw);max-height:54px;object-fit:contain}
.icons{display:flex;gap:10px}.icon{width:44px;height:44px;border:0;border-radius:13px;background:#f3f2ef;display:grid;place-items:center;cursor:pointer}.icon img{width:30px;height:30px;display:block}
main{width:min(1040px,calc(100% - 40px));margin:auto;padding:48px 0 70px}.page{display:none}.page.active{display:block}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.homegrid button{min-height:150px;border:0;border-radius:24px;font-size:clamp(22px,2.7vw,34px);font-weight:700;color:var(--ink);cursor:pointer}
.pink{background:var(--pink)}.green{background:var(--green)}.orange{background:var(--orange)}.blue{background:var(--blue)}.purple{background:var(--purple);grid-column:1/-1}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:20px}h1{margin:0;font-size:clamp(26px,3vw,38px)}.back{border:0;border-radius:14px;background:#fff;padding:11px 16px;font-weight:700;cursor:pointer}
.units{display:grid;grid-template-columns:1fr 1fr;gap:14px}.unit{min-height:92px;border:0;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);cursor:pointer}
.unit span{min-width:80px;padding:8px 10px;border-radius:999px;background:#ffffffaa;text-align:center;font-weight:700}.unit b{font-size:22px}
.tintpink{background:#F48BA855}.tintgreen{background:#A8D08D60}.tintorange{background:#FFB46360}.tintblue{background:#8BB7E860}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.cat-column{display:flex;flex-direction:column;gap:12px}.cat{width:100%;min-height:72px;border:0;border-radius:16px;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(78,66,58,.05)}
.cat-pink{background:#F48BA870}
.cat-green{background:#A8D08D78}
.cat-orange{background:#FFB46378}
.cat-blue{background:#8BB7E875}
.cat-olive{background:#C9C78478}
.cat-purple{background:#B59AD975}
@media(max-width:720px){header{height:72px;padding:0 16px}header img{width:min(360px,60vw);max-height:44px}main{width:min(100% - 28px,560px);padding-top:30px}.homegrid,.units{grid-template-columns:1fr}.purple{grid-column:auto}.homegrid button{min-height:108px;font-size:23px}.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}}

.cat.cat-pink{background:#F48BA8 !important}
.cat.cat-green{background:#A8D08D !important}
.cat.cat-orange{background:#FFB463 !important}
.cat.cat-blue{background:#8BB7E8 !important}
.cat.cat-olive{background:#D6D58B !important}
.cat.cat-purple{background:#B59AD9 !important}

.unit-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.unit-sidebar{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 14px rgba(78,66,58,.07);position:sticky;top:106px}
.today-button{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#8BB7E82E;color:var(--ink);font-size:17px;font-weight:700;text-align:left;cursor:pointer;margin-bottom:18px}
.word-select-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.total-count{font-size:13px;font-weight:700;color:var(--brown);background:#f4f1ee;padding:5px 9px;border-radius:999px}
.vocab-group{border-top:1px solid #e7e4e0;padding-top:9px;margin-top:9px}
.vocab-row{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center}
.vocab-row input{width:18px;height:18px;accent-color:var(--blue)}
.vocab-toggle{border:0;background:transparent;padding:8px 0;display:flex;justify-content:space-between;width:100%;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
.word-list{display:none;padding:3px 0 8px 28px;flex-wrap:wrap;gap:6px}.vocab-group.open .word-list{display:flex}
.word-chip{border:1px solid #e4dfda;background:#faf9f7;border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.word-chip.off{color:#aaa39e;background:#f0efed;text-decoration:line-through}
.unit-main-title{margin:0 0 18px;font-size:22px}.activity-section{margin-bottom:26px}.activity-section h3{margin:0 0 10px;font-size:16px;color:var(--brown)}
.activity-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.activity-card{min-height:104px;border:0;border-radius:18px;padding:18px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(78,66,58,.06)}
.activity-card b{display:block;font-size:19px;margin-bottom:6px}.activity-card span{font-size:13px;color:#665f5a}
.practice{background:#8BB7E849}.class-play{background:#A8D08D55}.team-play{background:#FFB46355}.solo-play{background:#B59AD94D}.share-card{background:#fff;border:1px dashed #B59AD9}
@media(max-width:860px){.unit-layout{grid-template-columns:1fr}.unit-sidebar{position:static}}

/* Pronunciation practice */
.pron-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.pron-menu{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(78,66,58,.07);position:sticky;top:106px}
.pron-menu-title{margin:0 0 12px;font-size:18px}
.menu-accordion-btn{width:100%;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:700;text-align:left;padding:8px 0;cursor:pointer;display:flex;justify-content:space-between}
.menu-accordion-body{display:block;padding:2px 0 10px}
.menu-accordion.closed .menu-accordion-body{display:none}
.menu-block{padding:12px 0;border-top:1px solid #e7e4e0}
.menu-block h3{margin:0 0 8px;font-size:14px;color:var(--brown)}
.option-list{display:flex;flex-direction:column;gap:7px}
.option-row{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.option-row input{width:17px;height:17px;accent-color:var(--blue)}
.indent{padding-left:22px}
.pron-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pron-toolbar button{border:0;border-radius:13px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(78,66,58,.07)}
.pron-toolbar .expand-btn{background:#8BB7E833}
.pron-scroll{height:calc(100vh - 188px);min-height:470px;overflow-y:scroll;padding:4px 10px 18px 4px;scrollbar-gutter:stable}
.pron-scroll::-webkit-scrollbar{width:12px}
.pron-scroll::-webkit-scrollbar-track{background:#eeeae6;border-radius:8px}
.pron-scroll::-webkit-scrollbar-thumb{background:#8BB7E8;border-radius:8px;border:3px solid #eeeae6}
.cards-grid{display:grid;gap:14px}
.cards-grid.size-large{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards-grid.size-medium{grid-template-columns:repeat(5,minmax(0,1fr))}
.cards-grid.size-small{grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.pron-card{aspect-ratio:3/4;background:#fff;border:1px solid #e5e1dd;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 7px rgba(78,66,58,.05)}
.card-picture{flex:1;background:#fff;min-height:0}
.card-label{border-top:1px solid #ece8e4;min-height:50px;padding:8px 6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:16px;line-height:1.15}
.size-medium .card-label{font-size:12px;min-height:42px}
.size-small .card-label{font-size:9px;min-height:32px;padding:4px 2px}
.pron-card.hide-en .en-text{display:none}
.pron-card .jp-label{display:none}
.pron-card.show-jp .jp-label{display:block;font-size:.72em;font-weight:500;color:#766e69;margin-top:3px}
.pron-card.hide-picture .card-picture{display:none}
.pron-card.hide-picture{aspect-ratio:auto;min-height:76px}
.pron-focus{display:none;height:calc(100vh - 188px);min-height:470px;background:#fff;border-radius:18px;align-items:center;justify-content:center;position:relative}
.pron-focus.active{display:flex}
.pron-scroll.hidden{display:none}
.focus-card{width:min(62vh,560px);aspect-ratio:3/4;border:1px solid #e5e1dd;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.focus-picture{flex:1}
.focus-label{border-top:1px solid #ece8e4;padding:16px;text-align:center;font-size:30px;font-weight:700}
.focus-nav{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:center;gap:10px}
.focus-nav button{border:0;border-radius:12px;padding:9px 14px;background:#8BB7E833;font-weight:700;color:var(--ink)}
body.pron-fullscreen header{display:none}
body.pron-fullscreen main{width:100%;max-width:none;padding:0;margin:0}
body.pron-fullscreen #pronunciation .pron-layout{display:block}
body.pron-fullscreen #pronunciation .pron-menu{display:none}
body.pron-fullscreen #pronunciation .pron-workspace{height:100vh;padding:14px}
body.pron-fullscreen #pronunciation .pron-scroll,
body.pron-fullscreen #pronunciation .pron-focus{height:calc(100vh - 62px);min-height:0}
body.pron-fullscreen #pronunciation .pron-toolbar{margin-bottom:8px}
@media(max-width:900px){
  .pron-layout{grid-template-columns:260px minmax(0,1fr)}
  .cards-grid.size-small{grid-template-columns:repeat(5,minmax(0,1fr))}
}


/* Dynamic textbook vocabulary */
@font-face{font-family:'DEKIRU Andika';src:url('assets/fonts/andika/Andika-Regular.ttf') format('truetype');font-display:swap;font-style:normal;font-weight:400}
@font-face{font-family:'DEKIRU Andika';src:url('assets/fonts/andika/Andika-Bold.ttf') format('truetype');font-display:swap;font-style:normal;font-weight:700}
header{padding:0 18px 0 0}
.header-brand{display:flex;align-items:center;gap:10px;min-width:0}.header-brand .header-logo{width:min(560px,55vw);max-height:58px;object-fit:contain;object-position:left center}.header-version{flex:0 0 auto;color:#8b7b71;font:700 13px/1 'DEKIRU Andika','Trebuchet MS',Arial,sans-serif;white-space:nowrap}
header .icons{gap:12px}header .icon{width:56px;height:56px;padding:0;overflow:hidden}header .icon img{width:100%;height:100%;max-height:none;object-fit:contain;display:block}
.back-icon-button,.unit-main-back,.pron-toolbar button.back-icon-button{width:48px;height:48px;min-width:48px;border:0;background:transparent;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:none}.back-icon-button img,.unit-main-back img,.talk-back-compact img{width:100%;height:100%;display:block;object-fit:contain}
.page#lt1unit,.page#pronunciation{width:min(1680px,calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
.unit-layout,.pron-layout{grid-template-columns:minmax(200px,.75fr) minmax(0,3.25fr);gap:16px}
.unit-sidebar,.pron-menu{top:100px;max-height:calc(100vh - 116px);overflow-y:auto;scrollbar-gutter:stable}
.unit-context{padding:2px 2px 12px;border-bottom:1px solid #e7e4e0;margin-bottom:14px}
.unit-course{font-size:14px;font-weight:700;color:var(--brown);letter-spacing:.01em}
.unit-title{margin:4px 0 14px;font-size:22px;line-height:1.25;color:var(--ink)}
.today-button{margin-bottom:0}
.unit-main-toolbar{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:12px}
.unit-main-toolbar .unit-main-title{margin:0}
.vocabulary-groups{min-width:0}
.vocab-toggle{font-size:14px;font-weight:600;line-height:1.4;text-align:left;gap:5px}
.word-select-head strong{font-size:15px;font-weight:600}
.vocab-group.advanced{border-top-color:#d8e4f2}
.vocab-group.advanced .vocab-toggle{color:#54779e}
.vocab-group.disabled .word-chip{opacity:.58}
.pron-settings{border-top:2px solid #eee9e4;margin-top:16px;padding-top:8px}
.pron-settings-title{font-size:15px;margin:4px 0 6px;color:var(--brown)}
.pron-workspace-title{font-size:20px;margin:0 auto 0 0}
.pron-word-accordion{border-top:1px solid #e7e4e0;border-bottom:1px solid #e7e4e0;margin:0 0 14px}
.pron-word-accordion-button{width:100%;border:0;background:transparent;padding:12px 0;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;color:var(--ink);cursor:pointer;text-align:left}
.pron-word-accordion-button strong{font-size:15px}.pron-word-accordion-button .accordion-arrow{font-size:13px;transition:transform .18s ease}
.pron-word-accordion.closed .pron-word-accordion-body{display:none}.pron-word-accordion:not(.closed) .accordion-arrow{transform:rotate(180deg)}
.pron-word-accordion-body{padding-bottom:10px}
.pron-mode-choice{display:flex;flex-direction:column;gap:7px;padding:5px 0 10px}
.pron-mode-choice .option-row{font-weight:700}
.pron-mode-panel{display:none;border-top:1px solid #e7e4e0;padding-top:12px}.pron-mode-panel.active{display:block}
.pron-card{position:relative;cursor:pointer;color:var(--ink);font:inherit;padding:0;aspect-ratio:4/5}
.pron-card .card-picture{flex:0 0 auto;width:calc(100% - 24px);aspect-ratio:1/1;margin:12px 12px 0}
.pron-card .card-label{flex:1;min-height:68px;padding:10px 8px;font-family:'RuRiRu Font','DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-weight:400;font-size:28px;line-height:1.05}
.cards-grid.size-large .card-label{font-size:34px;min-height:88px}
.cards-grid.size-medium .card-picture{width:calc(100% - 18px);margin:9px 9px 0}
.cards-grid.size-medium .card-label{font-size:23px;min-height:58px;padding:8px 5px}
.cards-grid.size-small .card-picture{width:calc(100% - 10px);margin:5px 5px 0}
.cards-grid.size-small .card-label{font-size:14px;min-height:34px;padding:5px 2px}
.focus-label{font-family:'RuRiRu Font','DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-weight:400;font-size:clamp(34px,4vw,64px)}
.pron-card:hover{border-color:#aac9eb;box-shadow:0 4px 12px rgba(78,66,58,.12)}
.pron-card:focus-visible,.focus-card:focus-visible{outline:3px solid #6d9fd8;outline-offset:2px}
.pron-card.speaking,.focus-card.speaking{outline:3px solid var(--pink);outline-offset:2px}
.focus-card{cursor:pointer}
.auto-focus{display:none;height:calc(100vh - 188px);min-height:470px;background:#fff;border-radius:18px;padding:20px;align-items:center;justify-content:center}
.auto-focus.active{display:flex}
.auto-grid{width:100%;display:grid;gap:18px;grid-template-columns:repeat(var(--auto-columns,1),minmax(0,1fr));align-items:center}
.auto-grid .pron-card{width:min(100%,420px);justify-self:center}
body.pron-fullscreen #pronunciation .auto-focus{height:calc(100vh - 62px);min-height:0}
.card-picture,.focus-picture{display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.card-picture img,.focus-picture img{width:100%;height:100%;object-fit:contain;display:block}
.card-picture.no-image::after,.focus-picture.no-image::after{content:'No image';color:#aaa;font-size:12px}
.unit-empty{background:#fff;border-radius:18px;padding:20px;color:var(--brown)}
.activity-accordion{margin:0!important;border-top:1px solid #e9e2dc;scroll-margin-top:110px}.activity-accordion:last-child{border-bottom:1px solid #e9e2dc}
.activity-accordion-toggle{width:100%;border:0;background:transparent;padding:16px 4px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.activity-accordion-toggle:hover{color:#765b4c}.activity-section-title{font-size:18px;font-weight:700}.activity-arrow{font-size:15px;transition:transform .18s ease}.activity-accordion.open .activity-arrow{transform:rotate(180deg)}
.activity-accordion-body{display:none;padding:0 0 20px}.activity-accordion.open .activity-accordion-body{display:block}.activity-accordion .activity-grid{margin-top:0}
.activity-accordion[hidden]{display:none}
.talk-activity-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.talk-activity-choice{min-height:150px;border:2px solid #eadbd3;border-radius:22px;background:#fff;padding:13px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 6px 18px rgba(77,60,50,.08);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.talk-activity-choice:hover{transform:translateY(-2px);border-color:#dda9bd;box-shadow:0 9px 22px rgba(77,60,50,.12)}
.talk-activity-heading{display:flex;align-items:center;gap:7px;color:var(--brown);font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap}
.talk-activity-choice .activity-number{display:inline-grid;place-items:center;flex:0 0 auto;width:27px;height:27px;border-radius:50%;background:#f9e4ec;color:#875b6d;font-weight:700}
.talk-activity-choice strong{display:block;margin:11px 0 0 34px;font-family:'RuRiRu Font','DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-size:clamp(18px,1.35vw,23px);font-weight:400;line-height:1.3}
.talk-activity-choice strong span{display:block}
.talk-player-mode{overflow-x:hidden}.talk-player-mode header{display:none}.talk-player-mode main{width:100%;max-width:none;min-width:0;margin:0;padding:0;overflow-x:hidden}
.page#talkSentences{width:calc(100vw - 16px);max-width:calc(100vw - 16px);min-width:0;margin:0 8px;padding:8px 0;overflow-x:hidden}
.talk-shell{width:100%;max-width:100%;min-width:0;height:calc(100vh - 16px);min-height:620px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
.talk-topbar{width:100%;max-width:100%;min-width:0;display:grid;grid-template-columns:48px minmax(0,1fr) 118px;align-items:center;gap:8px;padding:7px;border:1px solid #ece6e1;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(77,60,50,.05);overflow:hidden}
.talk-back{border:1px solid #e7e1dc;background:#fff;border-radius:12px;padding:9px 14px;color:var(--ink);font-weight:700;cursor:pointer}
.talk-top-control{align-self:stretch;min-height:64px;border:2px solid #d9d1ca;border-radius:10px;background:#fff;color:var(--ink);padding:6px 9px;font:700 13px/1.15 inherit;cursor:pointer;white-space:nowrap}.talk-top-control:hover{background:#faf7f4}.talk-top-control.talk-back-compact{align-self:center;width:48px;height:48px;min-width:48px;min-height:48px;border:0;background:transparent;padding:0;border-radius:12px;overflow:hidden;font-size:0;line-height:1}
.talk-audio-controls{align-self:stretch;width:118px;min-width:118px;height:64px;display:grid;grid-template-rows:36px 24px;gap:4px}.talk-icon-row{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}.talk-icon-control{position:relative;min-width:0;border:0;border-radius:8px;background:#fff;padding:0;overflow:hidden;cursor:pointer}.talk-icon-control:focus-visible{outline:3px solid #5e9bd2;outline-offset:1px}.talk-svg-crop{position:absolute;inset:0;overflow:hidden}.talk-svg-crop img{position:absolute;top:-5%;left:0;height:110%;width:auto;max-width:none;display:block;pointer-events:none}.talk-svg-crop.second img{right:0;left:auto}.talk-icon-control[aria-pressed="false"] .talk-svg-crop{opacity:.45;filter:grayscale(.75)}.talk-icon-control[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #6a9fd1}.talk-sound-toggle[aria-pressed="false"]::after{content:'';position:absolute;left:10%;top:48%;width:80%;height:3px;border-radius:3px;background:#d85d5d;transform:rotate(-32deg)}.talk-clarity-toggle[aria-pressed="true"]::after{content:'✓';position:absolute;right:2px;top:1px;width:16px;height:16px;border-radius:50%;background:#fff;color:#315f8a;font:900 13px/16px Arial,sans-serif}.talk-speed-control{min-height:24px;border:1px solid #d9d1ca;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;gap:3px;padding:1px 4px;color:#5e554f;font:700 11px/1 inherit;white-space:nowrap}.talk-speed-control select{min-width:0;max-width:72px;border:0;background:transparent;color:#2f2925;font:700 11px/1 inherit;cursor:pointer;outline:0}
.talk-rules{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;min-width:0}
.talk-rule{min-height:64px;border:4px solid var(--role-color);border-radius:11px;background:var(--role-bg);color:#2f2925;padding:5px 4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(19px,1.5vw,27px);font-weight:800;line-height:1.15;white-space:nowrap}
.role-subject{--role-color:#e45757;--role-bg:#fff1f1}.role-negative{--role-color:#d8ad12;--role-bg:#fff9df}.role-verb{--role-color:#ef8fac;--role-bg:#fff2f6}.role-adjective{--role-color:#69af78;--role-bg:#f0faf2}.role-object{--role-color:#8a70cb;--role-bg:#f4f0ff}.role-place{--role-color:#e79643;--role-bg:#fff5e9}.role-time{--role-color:#5e9bd2;--role-bg:#eef7ff}.role-neutral{--role-color:#a89f98;--role-bg:#f6f4f2}
.talk-stage-wrap{position:relative;width:100%;max-width:100%;min-width:0;min-height:0;display:flex}
.talk-stage{width:100%;max-width:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:safe center;border:1px solid #eee8e3;border-radius:20px;background:#fffdfb;padding:8px;overflow:auto}
.talk-stage-zoom{position:absolute;z-index:4;right:12px;top:12px;width:42px;height:42px;border:2px solid #d9d1ca;border-radius:12px;background:rgba(255,255,255,.94);color:#51463f;font:800 21px/1 Arial,sans-serif;cursor:pointer;box-shadow:0 2px 7px rgba(69,51,42,.08)}.talk-stage-zoom[aria-pressed="true"]{background:#eef7ff;border-color:#75a7d7}.talk-stage-zoom:focus-visible{outline:3px solid #78a8db;outline-offset:2px}
.talk-sentence-row{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-width:max-content}
.talk-token-slot{display:flex;align-items:flex-end;gap:10px;flex:0 0 auto}
.talk-sentence-audio{align-self:center;flex:0 0 auto;width:54px;height:54px;border:0;border-radius:50%;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 7px rgba(69,51,42,.08)}.talk-sentence-audio img{width:100%;height:100%;display:block}.talk-sentence-audio:hover{filter:brightness(.97)}.talk-sentence-audio:focus-visible{outline:3px solid #78a8db;outline-offset:3px}
.talk-card{position:relative;width:clamp(136px,10.5vw,184px);aspect-ratio:210/297;flex:0 0 auto;border:4px solid var(--role-color);border-radius:15px;background:#fff;padding:8px;display:grid;grid-template-rows:1fr auto;overflow:hidden;color:var(--ink);font:inherit;box-shadow:0 3px 9px rgba(69,51,42,.09);cursor:pointer}
.talk-card-picture{width:100%;aspect-ratio:1/1;align-self:start;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px;background:#fff}
.talk-card-picture img{width:100%;height:100%;object-fit:contain;display:block}.talk-card-picture.symbol{font-family:'DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-size:clamp(48px,5vw,78px);font-weight:700;color:var(--role-color)}
.talk-card-word{min-height:54px;display:flex;align-items:center;justify-content:center;padding:6px 1px 2px;font-family:'RuRiRu Font','DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-size:clamp(28px,2.5vw,40px);font-weight:400;line-height:1.05;text-align:center;white-space:nowrap;max-width:100%;overflow:hidden}.talk-card-word.long{font-size:clamp(20px,1.85vw,30px)}.talk-card-word.extra-long{font-size:clamp(15px,1.4vw,23px);line-height:1;white-space:nowrap}
.talk-card:hover{box-shadow:0 5px 14px rgba(69,51,42,.15)}.talk-card:focus-visible,.talk-choice:focus-visible{outline:3px solid #78a8db;outline-offset:3px}.talk-card.speaking{outline:3px solid var(--pink);outline-offset:3px}
.talk-punctuation{font-family:'DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-size:clamp(42px,4.2vw,70px);font-weight:700;line-height:.72;padding:0 2px 3px;color:var(--ink)}
.talk-sequence-layout{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.talk-question-layout{width:max-content;min-width:100%;display:grid;grid-template-columns:auto auto;align-items:center;justify-content:center;gap:clamp(10px,1.2vw,20px);padding:0 2px}
.talk-question-prompts{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;min-width:max-content}
.talk-responses{display:flex;flex-direction:column;gap:10px;padding-left:clamp(7px,.7vw,12px);border-left:2px solid #eee5df}.talk-response-row{display:flex;align-items:flex-end;gap:6px;min-width:max-content}
.talk-question-row .talk-card{width:clamp(116px,8.6vw,158px)}.talk-response-row .talk-card{width:clamp(96px,7vw,128px);border-width:3px;padding:6px}.talk-response-row .talk-card-word{min-height:43px;font-size:clamp(23px,2vw,32px);padding-inline:0}.talk-response-row .talk-card-picture.symbol{font-size:clamp(39px,3.8vw,58px)}.talk-response-row .talk-sentence-audio{width:42px;height:42px}.talk-response-row .talk-punctuation{font-size:clamp(34px,3vw,48px)}
.talk-stage.enlarged .talk-card{width:clamp(152px,12vw,210px)}.talk-stage.enlarged .talk-question-row .talk-card{width:clamp(136px,10vw,184px)}.talk-stage.enlarged .talk-response-row .talk-card{width:clamp(110px,8.2vw,146px)}
.talk-choice-panel{width:100%;max-width:100%;min-width:0;border:1px solid #e9e2dc;border-radius:14px;background:#fff;padding:5px 8px 6px;box-shadow:0 -2px 12px rgba(77,60,50,.05);overflow:hidden}
.talk-choice-head{display:flex;align-items:center;gap:5px;margin-bottom:3px;overflow-x:auto;padding:0}.talk-role-tabs,.talk-category-filters{display:flex;align-items:center;gap:5px;flex:0 0 auto}.talk-category-filters:empty{display:none}
.talk-role-tab,.talk-category-filter{min-height:28px;border:2px solid var(--role-color);border-radius:999px;background:#fff;color:#2f2925;padding:3px 9px;font:700 13px/1.05 inherit;white-space:nowrap;cursor:pointer}.talk-role-tab[aria-pressed="true"],.talk-category-filter[aria-pressed="true"]{background:var(--role-bg)}.talk-category-filter.excluded{border-color:#c8c2bd;background:#eeeae7;color:#9a928d;text-decoration:line-through}.talk-role-tab:focus-visible,.talk-category-filter:focus-visible{outline:3px solid #78a8db;outline-offset:2px}
.talk-choices{width:100%;max-width:100%;min-width:0;display:flex;gap:5px;overflow-x:auto;overscroll-behavior-inline:contain;padding:1px 1px 3px;scrollbar-gutter:stable}
.talk-choice{flex:0 0 74px;width:74px;min-width:74px;border:2px solid var(--role-color);border-radius:9px;background:#fff;padding:2px;display:grid;grid-template-rows:1fr auto;cursor:pointer;color:var(--ink)}
.talk-choice.active{background:var(--role-bg);box-shadow:0 0 0 2px color-mix(in srgb,var(--role-color) 35%,white)}.talk-choice-picture{width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:5px}.talk-choice-picture img{width:100%;height:100%;object-fit:contain;display:block}.talk-choice-word{min-height:25px;padding:2px 1px 0;display:flex;align-items:center;justify-content:center;font-family:'RuRiRu Font','DEKIRU Andika','Trebuchet MS',Arial,sans-serif;font-size:12px;font-weight:400;line-height:1.02;text-align:center;white-space:normal;overflow-wrap:anywhere}.talk-choice-word.long{font-size:10.5px}.talk-choice-word.extra-long{font-size:9.5px}
.talk-no-choices{padding:10px;color:#8a766a;font-size:13px}
@media(max-width:860px){
  .unit-layout,.pron-layout{grid-template-columns:1fr}
  .page#lt1unit,.page#pronunciation{width:100%;margin-left:0;transform:none}
  .unit-sidebar,.pron-menu{position:static;max-height:none}
  .talk-activity-list{grid-template-columns:1fr}.page#talkSentences{width:100%;margin-left:0;transform:none}
  .talk-shell{height:auto;min-height:auto;display:block}.talk-topbar{grid-template-columns:48px minmax(0,1fr)}.talk-topbar .talk-rules{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(4,1fr);margin-top:8px}.talk-audio-controls{grid-column:2;min-width:0}.talk-stage-wrap{min-height:390px;margin:8px 0}.talk-stage{justify-content:flex-start}
  .talk-question-layout{min-width:max-content}.talk-choices{margin-top:8px}
}

s":{"expressions":"表現","feelings":"気分","numbers":"数","colors":"色","shapes":"形","sports":"スポーツ","foods":"食べ物","drinks":"飲み物","desserts":"デザート","fruits_vegetables":"果物・野菜","meals":"食事","ingredients":"食材","tastes":"味など","animals":"動物","nature":"自然","sea_animals":"海の生き物","bugs":"虫","living_things":"生き物の問題・できること","months":"月","dates":"日付","days":"曜日","seasons":"季節","weather":"天気","people":"人","personality":"性格など","family":"家族","actions_5":"動作など（5年）","actions_6":"動作など（6年）","past_actions":"したこと","frequency":"頻度","daily_life":"一日の生活","clothes":"衣類","body":"からだ","town":"町","directions":"道案内","positions":"位置","subjects":"教科","school":"学校","stationery":"文房具","instruments":"楽器","personal_items":"身の回りのもの","activities":"遊びなど","school_events":"学校行事","annual_events":"年中行事","impressions":"感想・様子","states":"状態","jobs":"職業","club_activities":"部活動"}}</script>
<script>
const APP_DATA=JSON.parse(document.getElementById('dekiru-data').textContent);
const cardById=new Map(APP_DATA.cards.map(card=>[card.id,card]));
const expressionById=new Map(APP_DATA.expressions.map(expression=>[expression.id,expression]));
const pages=[...document.querySelectorAll('.page')];
let currentUnit=1;
let currentUnitItems=[];
let vocabularyState={groups:new Map(),items:new Map(),open:new Set()};
let focusIndex=0;
let focusOrder=[];
let pronunciationMode='list';
let autoTimer=null;
let autoIndex=0;
let autoOrder=[];
let speakingElement=null;
let talkActivity='like';
let talkChoiceRole='object';
let talkChoiceTarget='object';
let talkSelected={subject:'person_001',questionSubject:'person_002',responseSubject:'person_001',verb:'action5_002',object:'color_002',negativeObject:'color_009'};
let talkHiddenCategories=new Set();
let talkSoundEnabled=true;
let talkSpeechRate=.55;
let talkClearSpeech=false;
let talkStageEnlarged=false;
let talkSpeechSequenceId=0;
let talkSpeechPauseTimer=null;
const TALK_OBJECT_CATEGORIES=['colors','sports','desserts','drinks','fruits_vegetables'];
const CONTRACTION_PARTS={"don't":['do','not'],"i'm":['I','am'],"you're":['you','are'],"it's":['it','is'],"that's":['that','is'],"what's":['what','is'],"who's":['who','is'],"can't":['can','not'],"won't":['will','not']};

function decorateBackButtons(){
  document.querySelectorAll('button.back,#pronBack').forEach(button=>{
    const label=button.getAttribute('aria-label')||button.textContent.trim()||'戻る';
    button.classList.add('back-icon-button');
    button.setAttribute('aria-label',label);
    button.title=label;
    if(!button.querySelector('img'))button.innerHTML='<img src="assets/ui/back.svg" alt="">';
  });
}
decorateBackButtons();

function show(id){
  if(id!=='pronunciation'){
    stopAuto();
    stopTalkSpeechSequence();
  }
  pages.forEach(page=>page.classList.toggle('active',page.id===id));
  document.body.classList.toggle('talk-player-mode',id==='talkSentences');
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav').forEach(button=>button.addEventListener('click',()=>show(button.dataset.to)));
document.querySelectorAll('[data-back="home"]').forEach(button=>button.addEventListener('click',()=>show('home')));
document.querySelectorAll('.back:not(#backToLt1)').forEach(button=>button.addEventListener('click',()=>show(button.dataset.back||'home')));
document.getElementById('homeBtn')?.addEventListener('click',()=>show('home'));
document.getElementById('backToLt1')?.addEventListener('click',()=>show('lt1'));

function categoryLabel(category){return APP_DATA.categoryLabels[category]||category}
function resolveMapping(row){
  const expression=row.expressionId?expressionById.get(row.expressionId):null;
  const cardId=row.cardId||expression?.cardId||'';
  const card=cardId?cardById.get(cardId):null;
  return {
    key:row.expressionId||row.cardId,
    cardId,
    expressionId:row.expressionId,
    english:expression?.english||card?.english||row.expressionId||row.cardId,
    japanese:expression?.japanese||card?.japanese||'',
    speech:expression?.speech||card?.speech||expression?.english||card?.english||'',
    category:card?.category||'expressions',
    image:card?.image||'',
    order:row.order,
    level:'basic',
  };
}

function getUnitItems(unit){
  const current=APP_DATA.mappings.filter(row=>row.unit===unit).sort((a,b)=>a.order-b.order).map(resolveMapping);
  const allowed=APP_DATA.advancedCategoriesByUnit[unit]||[];
  const carried=APP_DATA.mappings
    .filter(row=>row.unit<unit)
    .sort((a,b)=>a.unit-b.unit||a.order-b.order)
    .map(resolveMapping)
    .filter(item=>allowed.includes(item.category));
  const basic=[];
  const seenBasic=new Set();
  [...current,...carried].forEach(item=>{
    const token=item.cardId?'card:'+item.cardId:'key:'+item.key;
    if(seenBasic.has(token))return;
    seenBasic.add(token);
    basic.push({...item,level:'basic'});
  });
  const basicCardIds=new Set(basic.map(item=>item.cardId).filter(Boolean));
  const rank={standard:0,special:1};
  const advanced=APP_DATA.cards
    .filter(card=>allowed.includes(card.category)&&card.displayGroup!=='category'&&card.displayGroup!=='plus'&&!basicCardIds.has(card.id))
    .sort((a,b)=>allowed.indexOf(a.category)-allowed.indexOf(b.category)||(rank[a.displayGroup]??9)-(rank[b.displayGroup]??9)||a.id.localeCompare(b.id))
    .map(card=>({key:card.id,cardId:card.id,expressionId:'',english:card.english,japanese:card.japanese,speech:card.speech,category:card.category,image:card.image,order:0,level:'advanced'}));
  return [...basic,...advanced];
}

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function groupItems(items,level){
  const groups=[];
  const byCategory=new Map();
  items.filter(item=>item.level===level).forEach(item=>{
    if(!byCategory.has(item.category)){
      const group={category:item.category,items:[]};
      byCategory.set(item.category,group);
      groups.push(group);
    }
    byCategory.get(item.category).items.push(item);
  });
  return groups;
}

function orderedVocabularyGroups(items){
  const basicGroups=groupItems(items,'basic');
  const advancedGroups=groupItems(items,'advanced');
  const basicByCategory=new Map(basicGroups.map(group=>[group.category,group]));
  const advancedByCategory=new Map(advancedGroups.map(group=>[group.category,group]));
  const categories=[...basicGroups.map(group=>group.category),...advancedGroups.map(group=>group.category).filter(category=>!basicByCategory.has(category))];
  const ordered=[];
  categories.forEach(category=>{
    if(basicByCategory.has(category))ordered.push({...basicByCategory.get(category),level:'basic'});
    if(advancedByCategory.has(category))ordered.push({...advancedByCategory.get(category),level:'advanced'});
  });
  return ordered;
}

function groupToken(group){return group.level+'|'+group.category}
function itemToken(item){return item.level+'|'+item.category+'|'+item.key}

function resetVocabularyState(){
  vocabularyState={groups:new Map(),items:new Map(),open:new Set()};
  const groups=orderedVocabularyGroups(currentUnitItems);
  groups.forEach((group,index)=>{
    const token=groupToken(group);
    vocabularyState.groups.set(token,group.level==='basic');
    group.items.forEach(item=>vocabularyState.items.set(itemToken(item),true));
    if(index===0)vocabularyState.open.add(token);
  });
}

function vocabularyMarkup(){
  const blocks=[];
  orderedVocabularyGroups(currentUnitItems).forEach(group=>{
    const token=groupToken(group);
    const checked=vocabularyState.groups.get(token)===true;
    const count=group.items.filter(item=>vocabularyState.items.get(itemToken(item))!==false).length;
    const chips=group.items.map(item=>{
      const selected=vocabularyState.items.get(itemToken(item))!==false;
      return '<button class="word-chip '+(selected?'':'off')+'" type="button" data-item-token="'+escapeHtml(itemToken(item))+'">'+escapeHtml(item.english)+'</button>';
    }).join('');
    blocks.push('<div class="vocab-group '+(group.level==='advanced'?'advanced ':'')+(checked?'':'disabled ')+(vocabularyState.open.has(token)?'open':'')+'" data-group-token="'+escapeHtml(token)+'"><div class="vocab-row"><input type="checkbox" '+(checked?'checked':'')+' aria-label="'+escapeHtml(categoryLabel(group.category))+' '+(group.level==='basic'?'ベーシック':'アドバンス')+'を使う"><button class="vocab-toggle" type="button"><span>'+escapeHtml(categoryLabel(group.category))+'　'+(group.level==='basic'?'ベーシック':'アドバンス')+' <small>('+count+')</small></span><span>▼</span></button></div><div class="word-list">'+chips+'</div></div>');
  });
  return blocks.join('')||'<div class="unit-empty">このUnitの語彙はまだ登録されていません。</div>';
}

function bindVocabularyEvents(target){
  target.querySelectorAll('.vocab-toggle').forEach(button=>button.addEventListener('click',()=>{
    const token=button.closest('.vocab-group').dataset.groupToken;
    if(vocabularyState.open.has(token))vocabularyState.open.delete(token);else vocabularyState.open.add(token);
    renderVocabularyMenus();
  }));
  target.querySelectorAll('.word-chip').forEach(chip=>chip.addEventListener('click',()=>{
    const token=chip.dataset.itemToken;
    vocabularyState.items.set(token,vocabularyState.items.get(token)===false);
    renderVocabularyMenus();
    if(document.getElementById('pronunciation').classList.contains('active'))buildPronunciation();
  }));
  target.querySelectorAll('.vocab-group input[type="checkbox"]').forEach(box=>box.addEventListener('change',()=>{
    const token=box.closest('.vocab-group').dataset.groupToken;
    vocabularyState.groups.set(token,box.checked);
    renderVocabularyMenus();
    if(document.getElementById('pronunciation').classList.contains('active'))buildPronunciation();
  }));
}

function renderVocabularyMenus(){
  const markup=vocabularyMarkup();
  ['unitVocabularyGroups','pronVocabularyGroups'].forEach(id=>{
    const target=document.getElementById(id);
    if(!target)return;
    target.innerHTML=markup;
    bindVocabularyEvents(target);
  });
  refreshCounts();
}

function renderVocabulary(unit){
  currentUnitItems=getUnitItems(unit);
  resetVocabularyState();
  renderVocabularyMenus();
}

function selectedItems(){
  return orderedVocabularyGroups(currentUnitItems).flatMap(group=>{
    if(vocabularyState.groups.get(groupToken(group))!==true)return [];
    return group.items.filter(item=>vocabularyState.items.get(itemToken(item))!==false);
  });
}

function refreshCounts(){
  const total=selectedItems().length;
  document.querySelectorAll('#lt1unit .total-count,#pronunciation .total-count').forEach(counter=>counter.textContent='使用 '+total+'語');
}

function setActivityAccordion(section,open){
  if(!section)return;
  section.classList.toggle('open',open);
  section.querySelector('.activity-accordion-toggle')?.setAttribute('aria-expanded',String(open));
}
function openActivityAccordion(name,scroll){
  let target=null;
  document.querySelectorAll('#lt1unit [data-activity-section]').forEach(section=>{
    const open=section.dataset.activitySection===name;
    setActivityAccordion(section,open);
    if(open)target=section;
  });
  if(scroll&&target)requestAnimationFrame(()=>target.scrollIntoView({behavior:'smooth',block:'start'}));
}
document.querySelectorAll('#lt1unit .activity-accordion-toggle').forEach(button=>button.addEventListener('click',()=>{
  const section=button.closest('[data-activity-section]');
  const willOpen=!section.classList.contains('open');
  document.querySelectorAll('#lt1unit [data-activity-section]').forEach(item=>setActivityAccordion(item,false));
  setActivityAccordion(section,willOpen);
}));

function openUnit(unit){
  currentUnit=unit;
  document.querySelectorAll('[data-unit-course]').forEach(target=>target.textContent="Let's Try 1 Unit "+unit);
  document.querySelectorAll('[data-unit-title]').forEach(target=>target.textContent=APP_DATA.unitTitles[unit]);
  renderVocabulary(unit);
  const talkSection=document.querySelector('#lt1unit [data-activity-section="talk"]');
  if(talkSection)talkSection.hidden=unit!==4;
  openActivityAccordion('',false);
  show('lt1unit');
}
document.querySelectorAll('[data-lt1-unit]').forEach(button=>button.addEventListener('click',()=>openUnit(Number(button.dataset.lt1Unit))));

function talkToken(word,role,cardId,symbol,speech,selectionKey){
  return {word,role,cardId:cardId||'',symbol:symbol||'',speech:speech||word.replace(/[,.?]$/,''),selectionKey:selectionKey||''};
}
function contractionParts(word){
  return CONTRACTION_PARTS[String(word||'').toLowerCase()]||[];
}
function talkWordSizeClass(word){
  const length=[...String(word||'')].length;
  return length>=12?' extra-long':length>=9?' long':'';
}
function fitTalkWordLabels(root){
  const apply=()=>{
    if(!root?.isConnected)return;
    root.querySelectorAll('.talk-card-word,.talk-choice-word').forEach(label=>{
      label.style.fontSize='';
      label.style.paddingInline='1px';
      const minimum=label.classList.contains('talk-choice-word')?9:11;
      let size=parseFloat(getComputedStyle(label).fontSize)||minimum;
      const available=Math.max(1,label.clientWidth-2);
      const textWidth=()=>{
        const range=document.createRange();
        range.selectNodeContents(label);
        return range.getBoundingClientRect().width;
      };
      while(textWidth()>available&&size>minimum){
        size=Math.max(minimum,size-1);
        label.style.fontSize=size+'px';
      }
    });
  };
  requestAnimationFrame(apply);
  document.fonts?.ready.then(apply);
}
function sentenceStartToken(token,index){
  if(index!==0)return token;
  const word=String(token.word||'');
  if(!word)return token;
  return {...token,word:word.charAt(0).toUpperCase()+word.slice(1)};
}
function talkCardMarkup(token){
  const source=token.cardId?cardById.get(token.cardId):null;
  const image=source?.image||'';
  const word=token.word||source?.english||'';
  const speech=token.speech||source?.speech||word;
  const expansionParts=contractionParts(word);
  const picture=image?'<img src="'+escapeHtml(image)+'" alt="" onerror="this.parentElement.classList.add(&quot;symbol&quot;);this.parentElement.textContent=&quot;?&quot;">':'<span aria-hidden="true">'+escapeHtml(token.symbol||'•')+'</span>';
  const expansionData=expansionParts.length?' data-talk-expansion="'+escapeHtml(expansionParts.join('|'))+'" title="長押しすると元の形を表示"':'';
  const selectionData=token.selectionKey?' data-talk-selection-key="'+escapeHtml(token.selectionKey)+'" data-talk-selection-role="'+escapeHtml(token.role)+'"':'';
  return '<button class="talk-card role-'+escapeHtml(token.role)+'" type="button" data-talk-speech="'+escapeHtml(speech)+'"'+selectionData+expansionData+' aria-label="'+escapeHtml(word)+' の音声を再生"><span class="talk-card-picture '+(image?'':'symbol')+'">'+picture+'</span><span class="talk-card-word'+talkWordSizeClass(word)+'">'+escapeHtml(word)+'</span></button>';
}
function talkRowMarkup(tokens,punctuation,extraClass){
  const displayTokens=tokens.map(sentenceStartToken);
  const sentence=displayTokens.map(token=>token.speech||token.word).join(' ')+punctuation;
  const parts=displayTokens.map(token=>token.speech||token.word);
  return '<div class="talk-sentence-row '+(extraClass||'')+'"><button class="talk-sentence-audio" type="button" data-talk-sentence="'+escapeHtml(sentence)+'" data-talk-parts="'+escapeHtml(JSON.stringify(parts))+'" aria-label="文章全体を発音する"><img src="assets/ui/read_aloud.svg" alt=""></button>'+displayTokens.map(token=>'<span class="talk-token-slot" data-talk-token-slot>'+talkCardMarkup(token)+'</span>').join('')+'<span class="talk-punctuation" aria-hidden="true">'+escapeHtml(punctuation)+'</span></div>';
}
function talkChoiceItems(role,includeHidden){
  const seen=new Set();
  let cards=[];
  if(role==='subject'){
    cards=['person_001','person_002'].map(id=>cardById.get(id));
  }else{
    const categories=role==='verb'?['actions_5']:TALK_OBJECT_CATEGORIES;
    cards=selectedItems().filter(item=>categories.includes(item.category)&&item.cardId).map(item=>cardById.get(item.cardId));
    if(role==='object'&&!includeHidden)cards=cards.filter(card=>card&&!talkHiddenCategories.has(card.category));
  }
  return cards.filter(card=>{
    if(!card||seen.has(card.id))return false;
    seen.add(card.id);
    return true;
  });
}
function talkObjectCategories(){
  const available=new Set(talkChoiceItems('object',true).map(card=>card.category));
  return TALK_OBJECT_CATEGORIES.filter(category=>available.has(category));
}
function renderTalkChoiceControls(){
  document.querySelectorAll('[data-talk-role]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.talkRole===talkChoiceRole)));
  const target=document.getElementById('talkCategoryFilters');
  if(talkChoiceRole!=='object'){
    target.innerHTML='';
    return;
  }
  target.innerHTML=talkObjectCategories().map(category=>{
    const visible=!talkHiddenCategories.has(category);
    return '<button class="talk-category-filter role-object '+(visible?'':'excluded')+'" type="button" data-talk-category="'+escapeHtml(category)+'" aria-pressed="'+String(visible)+'">'+escapeHtml(categoryLabel(category))+'</button>';
  }).join('');
  target.querySelectorAll('[data-talk-category]').forEach(button=>button.addEventListener('click',()=>{
    const category=button.dataset.talkCategory;
    if(talkHiddenCategories.has(category))talkHiddenCategories.delete(category);else talkHiddenCategories.add(category);
    const choices=talkChoiceItems('object',false);
    if(choices.length&&!choices.some(card=>card.id===talkSelected[talkChoiceTarget]))talkSelected[talkChoiceTarget]=choices[0].id;
    renderTalkChoiceControls();
    renderTalkStage();
    renderTalkChoices();
  }));
}
function renderTalkChoices(){
  const target=document.getElementById('talkChoices');
  const choices=talkChoiceItems(talkChoiceRole,false);
  if(!choices.length){
    target.innerHTML='<div class="talk-no-choices">表示できるカードがありません。Unit画面に戻って、使う単語を選んでください。</div>';
    return;
  }
  target.innerHTML=choices.map(card=>{
    const id=card.id;
    const active=id===talkSelected[talkChoiceTarget];
    return '<button class="talk-choice role-'+escapeHtml(talkChoiceRole)+' '+(active?'active':'')+'" type="button" data-talk-choice="'+escapeHtml(id)+'" aria-pressed="'+String(active)+'"><span class="talk-choice-picture"><img src="'+escapeHtml(card.image)+'" alt=""></span><span class="talk-choice-word'+talkWordSizeClass(card.english)+'">'+escapeHtml(card.english)+'</span></button>';
  }).join('');
  target.querySelectorAll('[data-talk-choice]').forEach(button=>button.addEventListener('click',()=>{
    talkSelected[talkChoiceTarget]=button.dataset.talkChoice;
    renderTalkStage();
    renderTalkChoices();
  }));
  fitTalkWordLabels(target);
}
function talkExpansionToken(part){
  const normalized=String(part||'').toLowerCase();
  if(normalized==='do')return talkToken('do','verb','','〇','do');
  if(normalized==='not')return talkToken('not','negative','','×','not');
  return talkToken(part,'neutral','','•',part);
}
function talkCardElement(token){
  const template=document.createElement('template');
  template.innerHTML=talkCardMarkup(token).trim();
  return template.content.firstElementChild;
}
function showTalkContractionParts(card,onRestore){
  const slot=card.closest('[data-talk-token-slot]');
  const parts=String(card.dataset.talkExpansion||'').split('|').filter(Boolean);
  if(!slot||!parts.length||slot.dataset.expanding==='true')return;
  slot.dataset.expanding='true';
  slot.classList.add('show-contraction-parts');
  const partCards=parts.map(part=>talkCardElement(talkExpansionToken(part)));
  slot.replaceChildren(...partCards);
  fitTalkWordLabels(slot);
  partCards.forEach(partCard=>partCard.addEventListener('click',()=>{
    if(talkSoundEnabled)speakText(partCard.dataset.talkSpeech,partCard,talkSpeechRate);
  }));
  setTimeout(()=>{
    slot.replaceChildren(card);
    slot.classList.remove('show-contraction-parts');
    delete slot.dataset.expanding;
    fitTalkWordLabels(slot);
    onRestore?.();
  },3000);
}
function bindTalkStageEvents(stage){
  stage.querySelectorAll('[data-talk-sentence]').forEach(button=>button.addEventListener('click',()=>{
    if(!talkSoundEnabled)return;
    let parts=[];
    try{parts=JSON.parse(button.dataset.talkParts||'[]');}catch{}
    speakTalkSentence(button.dataset.talkSentence,parts,button);
  }));
  stage.querySelectorAll('[data-talk-speech]').forEach(card=>{
    let timer=null;
    let longPressed=false;
    const showExpansion=()=>{
      if(!card.dataset.talkExpansion)return;
      longPressed=true;
      showTalkContractionParts(card,()=>{longPressed=false;});
    };
    const start=()=>{
      if(!card.dataset.talkExpansion)return;
      clearTimeout(timer);
      timer=setTimeout(showExpansion,550);
    };
    const finish=()=>{
      clearTimeout(timer);
    };
    card.addEventListener('pointerdown',start);
    card.addEventListener('pointerup',finish);
    card.addEventListener('pointercancel',finish);
    card.addEventListener('pointerleave',()=>{if(!longPressed)clearTimeout(timer)});
    card.addEventListener('contextmenu',event=>{if(card.dataset.talkExpansion){event.preventDefault();showExpansion();finish();}});
    card.addEventListener('click',event=>{
      if(longPressed){longPressed=false;event.preventDefault();return;}
      if(card.dataset.talkSelectionKey){
        talkChoiceTarget=card.dataset.talkSelectionKey;
        talkChoiceRole=card.dataset.talkSelectionRole||talkChoiceRole;
        renderTalkChoiceControls();
        renderTalkChoices();
      }
      if(talkSoundEnabled)speakText(card.dataset.talkSpeech,card,talkSpeechRate);
    });
  });
}
function renderTalkStage(){
  const stage=document.getElementById('talkStage');
  const selectableToken=(selectionKey,role,fallbackId,fallbackWord)=>{
    const source=cardById.get(talkSelected[selectionKey])||cardById.get(fallbackId);
    return talkToken(source?.english||fallbackWord,role,source?.id||fallbackId,'',source?.speech||source?.english||fallbackWord,selectionKey);
  };
  const subjectToken=selectableToken('subject','subject','person_001','I');
  const questionSubjectToken=selectableToken('questionSubject','subject','person_002','you');
  const responseSubjectToken=selectableToken('responseSubject','subject','person_001','I');
  const verbToken=selectableToken('verb','verb','action5_002','like');
  const objectToken=selectableToken('object','object','color_002','red');
  const negativeObjectToken=selectableToken('negativeObject','object','color_009','black');
  const likeRow=()=>talkRowMarkup([subjectToken,verbToken,objectToken],'.','talk-statement-row');
  const dontRow=()=>talkRowMarkup([subjectToken,talkToken("don't",'negative','','×',"don't"),verbToken,negativeObjectToken],'.','talk-statement-row');
  const questionBlock=(questionObject,leadRow='')=>{
    const question=talkRowMarkup([talkToken('Do','neutral','','?','Do'),questionSubjectToken,verbToken,questionObject],'?','talk-question-row');
    const yes=talkRowMarkup([talkToken('Yes,','neutral','','〇','Yes'),responseSubjectToken,talkToken('do','verb','','〇','do')],'.','talk-response-row');
    const no=talkRowMarkup([talkToken('No,','neutral','','×','No'),responseSubjectToken,talkToken("don't",'negative','','×',"don't")],'.','talk-response-row');
    return '<div class="talk-question-layout"><div class="talk-question-prompts">'+leadRow+question+'</div><div class="talk-responses">'+yes+no+'</div></div>';
  };
  if(talkActivity==='dont')stage.innerHTML=dontRow();
  else if(talkActivity==='like_dont')stage.innerHTML='<div class="talk-sequence-layout">'+likeRow()+dontRow()+'</div>';
  else if(talkActivity==='question')stage.innerHTML=questionBlock(objectToken);
  else if(talkActivity==='like_question')stage.innerHTML=questionBlock(objectToken,likeRow());
  else if(talkActivity==='dont_question')stage.innerHTML=questionBlock(negativeObjectToken,dontRow());
  else stage.innerHTML=likeRow();
  stage.classList.toggle('enlarged',talkStageEnlarged);
  bindTalkStageEvents(stage);
  fitTalkWordLabels(stage);
}
function updateTalkSoundButton(){
  const button=document.getElementById('talkSoundToggle');
  button.setAttribute('aria-pressed',String(talkSoundEnabled));
  button.setAttribute('aria-label',talkSoundEnabled?'カードの音声を切る':'カードの音声を入れる');
  button.title=talkSoundEnabled?'音声ON':'音声OFF';
}
function updateTalkClarityButton(){
  const button=document.getElementById('talkClarityToggle');
  button.setAttribute('aria-pressed',String(talkClearSpeech));
  button.setAttribute('aria-label',talkClearSpeech?'1枚ずつ読むのを切る':'1枚ずつ区切って読む');
  button.title=talkClearSpeech?'1枚ずつ読む：ON':'1枚ずつ読む：OFF';
}
function updateTalkStageZoomButton(){
  const button=document.getElementById('talkStageZoom');
  const stage=document.getElementById('talkStage');
  stage?.classList.toggle('enlarged',talkStageEnlarged);
  button?.setAttribute('aria-pressed',String(talkStageEnlarged));
  button?.setAttribute('aria-label',talkStageEnlarged?'文カードを元の大きさに戻す':'文カードを拡大する');
  if(button)button.title=talkStageEnlarged?'元の大きさに戻す':'文カードを拡大する';
  fitTalkWordLabels(stage);
}
function openTalkActivity(activity){
  talkActivity=activity;
  talkChoiceRole='object';
  talkChoiceTarget=(activity==='dont'||activity==='dont_question')?'negativeObject':'object';
  talkHiddenCategories.clear();
  talkSelected.subject='person_001';
  talkSelected.questionSubject='person_002';
  talkSelected.responseSubject='person_001';
  const verbs=talkChoiceItems('verb',false);
  talkSelected.verb=verbs.some(card=>card.id==='action5_002')?'action5_002':(verbs[0]?.id||'action5_002');
  const choices=talkChoiceItems('object',false);
  const preferredObject=activity==='dont_question'?'color_009':'color_002';
  const preferredNegative=activity==='dont'?'color_002':'color_009';
  talkSelected.object=choices.some(card=>card.id===preferredObject)?preferredObject:(choices[0]?.id||preferredObject);
  talkSelected.negativeObject=choices.some(card=>card.id===preferredNegative)?preferredNegative:(choices[0]?.id||preferredNegative);
  talkStageEnlarged=false;
  renderTalkChoiceControls();
  renderTalkStage();
  renderTalkChoices();
  updateTalkSoundButton();
  updateTalkClarityButton();
  updateTalkStageZoomButton();
  show('talkSentences');
}
document.getElementById('talkPlayerBack')?.addEventListener('click',()=>show('lt1unit'));
document.getElementById('talkSoundToggle')?.addEventListener('click',()=>{
  talkSoundEnabled=!talkSoundEnabled;
  if(!talkSoundEnabled)stopTalkSpeechSequence();
  updateTalkSoundButton();
});
document.getElementById('talkSpeechRate')?.addEventListener('change',event=>{
  talkSpeechRate=Number(event.target.value)||.55;
  stopTalkSpeechSequence();
});
document.getElementById('talkClarityToggle')?.addEventListener('click',()=>{
  talkClearSpeech=!talkClearSpeech;
  stopTalkSpeechSequence();
  updateTalkClarityButton();
});
document.getElementById('talkStageZoom')?.addEventListener('click',()=>{
  talkStageEnlarged=!talkStageEnlarged;
  updateTalkStageZoomButton();
});
document.querySelectorAll('[data-talk-role]').forEach(button=>button.addEventListener('click',()=>{
  talkChoiceRole=button.dataset.talkRole;
  talkChoiceTarget=talkChoiceRole==='object'&&['dont','dont_question'].includes(talkActivity)?'negativeObject':talkChoiceRole;
  renderTalkChoiceControls();
  renderTalkChoices();
}));
document.querySelectorAll('[data-talk-activity]').forEach(button=>button.addEventListener('click',()=>openTalkActivity(button.dataset.talkActivity)));

const pronCards=document.getElementById('pronCards');
function cardMarkup(item){
  const image=item.image?'<img src="'+escapeHtml(item.image)+'" alt="" onerror="this.parentElement.classList.add(&quot;no-image&quot;);this.remove()">':'';
  return '<button class="pron-card" type="button" data-speech="'+escapeHtml(item.speech||item.english)+'" aria-label="'+escapeHtml(item.english)+' の音声を再生"><div class="card-picture '+(item.image?'':'no-image')+'">'+image+'</div><div class="card-label"><div><span class="en-text">'+escapeHtml(item.english)+'</span><span class="jp-label">'+escapeHtml(item.japanese)+'</span></div></div></button>';
}

function stopTalkSpeechSequence(){
  talkSpeechSequenceId+=1;
  clearTimeout(talkSpeechPauseTimer);
  talkSpeechPauseTimer=null;
  window.speechSynthesis?.cancel();
  document.querySelectorAll('#talkStage .talk-card.speaking').forEach(card=>card.classList.remove('speaking'));
  speakingElement?.classList.remove('speaking');
  speakingElement=null;
}
function createSpeechUtterance(text,rate){
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='en-US';
  utterance.rate=Number.isFinite(rate)?rate:.86;
  const voices=window.speechSynthesis.getVoices();
  utterance.voice=voices.find(voice=>voice.lang==='en-US'&&voice.localService&&!/natural|online/i.test(voice.name))||voices.find(voice=>voice.lang==='en-US'&&voice.localService)||voices.find(voice=>voice.lang==='en-US')||voices.find(voice=>voice.lang?.startsWith('en')&&voice.localService)||voices.find(voice=>voice.lang?.startsWith('en'))||null;
  return utterance;
}
function speakText(text,element,rate){
  if(!text||!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  stopTalkSpeechSequence();
  const playbackId=talkSpeechSequenceId;
  const utterance=createSpeechUtterance(text,rate);
  speakingElement=element||null;
  speakingElement?.classList.add('speaking');
  utterance.onend=utterance.onerror=()=>{
    if(playbackId!==talkSpeechSequenceId)return;
    speakingElement?.classList.remove('speaking');
    speakingElement=null;
  };
  window.speechSynthesis.speak(utterance);
}
function speakTalkSentence(text,parts,element){
  if(!talkClearSpeech){
    speakText(text,element,talkSpeechRate);
    return;
  }
  if(!text||!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
  const spokenParts=(Array.isArray(parts)&&parts.length?parts:[text]).map(part=>String(part||'').trim()).filter(Boolean);
  if(!spokenParts.length)return;
  const punctuation=String(text).trim().match(/[?!.]$/)?.[0]||'';
  if(punctuation)spokenParts[spokenParts.length-1]+=punctuation;
  stopTalkSpeechSequence();
  const sequenceId=talkSpeechSequenceId;
  const row=element?.closest('.talk-sentence-row');
  const slots=[...(row?.querySelectorAll('[data-talk-token-slot]')||[])];
  const clearHighlights=()=>slots.forEach(slot=>slot.querySelectorAll('.talk-card.speaking').forEach(card=>card.classList.remove('speaking')));
  const highlightSlot=index=>slots[index]?.querySelectorAll('.talk-card').forEach(card=>card.classList.add('speaking'));
  speakingElement=element||null;
  speakingElement?.classList.add('speaking');
  const finish=()=>{
    clearHighlights();
    if(sequenceId!==talkSpeechSequenceId)return;
    speakingElement?.classList.remove('speaking');
    speakingElement=null;
  };
  const speakPart=index=>{
    if(sequenceId!==talkSpeechSequenceId)return;
    if(index>=spokenParts.length){finish();return;}
    clearHighlights();
    highlightSlot(index);
    const utterance=createSpeechUtterance(spokenParts[index],talkSpeechRate);
    utterance.onend=()=>{
      clearHighlights();
      if(sequenceId!==talkSpeechSequenceId)return;
      talkSpeechPauseTimer=setTimeout(()=>speakPart(index+1),360);
    };
    utterance.onerror=finish;
    window.speechSynthesis.speak(utterance);
  };
  speakPart(0);
}

function bindCardSpeech(container){
  container.querySelectorAll('.pron-card').forEach(card=>card.addEventListener('click',()=>speakText(card.dataset.speech,card)));
}

function buildPronunciation(){
  const items=selectedItems();
  pronCards.innerHTML=items.map(cardMarkup).join('');
  bindCardSpeech(pronCards);
  focusOrder=[...items];
  focusIndex=Math.min(focusIndex,Math.max(0,focusOrder.length-1));
  if(pronunciationMode==='single')prepareSingleOrder();
  if(pronunciationMode==='auto')startAuto();
  applyDisplay();
}
document.getElementById('openPronunciation')?.addEventListener('click',()=>{
  const accordion=document.getElementById('pronWordAccordion');
  accordion.classList.add('closed');
  document.getElementById('pronWordAccordionButton').setAttribute('aria-expanded','false');
  const listMode=document.querySelector('input[name="pronMode"][value="list"]');
  if(listMode)listMode.checked=true;
  buildPronunciation();
  setPronunciationMode('list');
  show('pronunciation');
});

document.getElementById('pronWordAccordionButton')?.addEventListener('click',()=>{
  const accordion=document.getElementById('pronWordAccordion');
  const closed=accordion.classList.toggle('closed');
  document.getElementById('pronWordAccordionButton').setAttribute('aria-expanded',String(!closed));
});

const pronExpand=document.getElementById('pronExpand');
function exitPronFullscreen(){document.body.classList.remove('pron-fullscreen');pronExpand.textContent='⛶ 全画面表示'}
document.getElementById('pronBack')?.addEventListener('click',()=>{if(document.body.classList.contains('pron-fullscreen'))exitPronFullscreen();else show('lt1unit')});
pronExpand?.addEventListener('click',()=>{const on=document.body.classList.toggle('pron-fullscreen');pronExpand.textContent=on?'↙ 元に戻す':'⛶ 全画面表示'});
document.querySelector('#displayAccordion .menu-accordion-btn')?.addEventListener('click',()=>document.getElementById('displayAccordion').classList.toggle('closed'));

function applyDisplay(){
  const picture=document.getElementById('showPicture').checked;
  const english=document.getElementById('showEnglish').checked;
  const japanese=document.getElementById('showJapanese').checked;
  document.querySelectorAll('#pronunciation .pron-card').forEach(card=>{
    card.classList.toggle('hide-picture',!picture);
    card.classList.toggle('hide-en',!english);
    card.classList.toggle('show-jp',japanese);
  });
}
['showPicture','showEnglish','showJapanese'].forEach(id=>document.getElementById(id)?.addEventListener('change',applyDisplay));

function makeExclusive(name,callback){
  const box=document.querySelector('[data-exclusive="'+name+'"]');
  if(!box)return;
  const inputs=[...box.querySelectorAll('input')];
  inputs.forEach(input=>input.addEventListener('change',()=>{
    if(input.checked)inputs.forEach(other=>{if(other!==input)other.checked=false});
    else if(!inputs.some(other=>other.checked))input.checked=true;
    callback?.(input);
  }));
}
makeExclusive('listSize',input=>{if(!input.checked)return;pronCards.classList.remove('size-large','size-medium','size-small');pronCards.classList.add('size-'+input.value)});

function checkedValue(name,fallback){
  return document.querySelector('[data-exclusive="'+name+'"] input:checked')?.value||fallback;
}
function shuffled(items){return [...items].sort(()=>Math.random()-.5)}

function renderFocus(){
  const item=focusOrder[focusIndex];
  const picture=document.querySelector('#pronFocus .focus-picture');
  const label=document.getElementById('focusLabel');
  const focusCard=document.getElementById('focusCard');
  if(!item){
    picture.classList.add('no-image');
    picture.innerHTML='';
    label.textContent='単語が選択されていません';
    focusCard.dataset.speech='';
    return;
  }
  picture.classList.toggle('no-image',!item.image);
  picture.innerHTML=item.image?'<img src="'+escapeHtml(item.image)+'" alt="" onerror="this.parentElement.classList.add(&quot;no-image&quot;);this.remove()">':'';
  label.textContent=item.english;
  focusCard.dataset.speech=item.speech||item.english;
}
function prepareSingleOrder(){
  focusOrder=selectedItems();
  if(checkedValue('singleMode','order')==='random')focusOrder=shuffled(focusOrder);
  focusIndex=0;
  renderFocus();
}

function stopAuto(){
  if(autoTimer){
    clearInterval(autoTimer);
    autoTimer=null;
  }
}
function renderAutoBatch(){
  const autoGrid=document.getElementById('autoGrid');
  if(!autoOrder.length){
    autoGrid.innerHTML='<div class="auto-empty">単語が選択されていません</div>';
    return;
  }
  const count=Math.min(Number(checkedValue('autoCount','1')),autoOrder.length);
  const batch=Array.from({length:count},(_,index)=>autoOrder[(autoIndex+index)%autoOrder.length]);
  autoGrid.style.setProperty('--auto-columns',String(count));
  autoGrid.innerHTML=batch.map(cardMarkup).join('');
  bindCardSpeech(autoGrid);
  autoIndex=(autoIndex+count)%autoOrder.length;
  applyDisplay();
}
function startAuto(){
  stopAuto();
  autoOrder=selectedItems();
  if(checkedValue('autoMode','order')==='random')autoOrder=shuffled(autoOrder);
  autoIndex=0;
  renderAutoBatch();
  if(autoOrder.length>1)autoTimer=setInterval(renderAutoBatch,3500);
}

function setPronunciationMode(mode){
  pronunciationMode=mode;
  document.querySelectorAll('[data-mode-panel]').forEach(panel=>panel.classList.toggle('active',panel.dataset.modePanel===mode));
  document.querySelector('#pronunciation .pron-scroll').classList.toggle('hidden',mode!=='list');
  document.getElementById('pronFocus').classList.toggle('active',mode==='single');
  document.getElementById('pronAuto').classList.toggle('active',mode==='auto');
  stopAuto();
  if(mode==='single')prepareSingleOrder();
  if(mode==='auto')startAuto();
}

document.querySelectorAll('input[name="pronMode"]').forEach(input=>input.addEventListener('change',()=>{
  if(input.checked)setPronunciationMode(input.value);
}));
makeExclusive('singleMode',input=>{if(pronunciationMode==='single'&&input.checked)prepareSingleOrder()});
makeExclusive('autoMode',input=>{if(pronunciationMode==='auto'&&input.checked)startAuto()});
makeExclusive('autoCount',input=>{if(pronunciationMode==='auto'&&input.checked)startAuto()});

document.getElementById('focusPrev')?.addEventListener('click',()=>{if(!focusOrder.length)return;focusIndex=(focusIndex-1+focusOrder.length)%focusOrder.length;renderFocus()});
document.getElementById('focusNext')?.addEventListener('click',()=>{if(!focusOrder.length)return;focusIndex=(focusIndex+1)%focusOrder.length;renderFocus()});
document.getElementById('focusCard')?.addEventListener('click',event=>speakText(event.currentTarget.dataset.speech,event.currentTarget));
document.getElementById('focusCard')?.addEventListener('keydown',event=>{
  if(event.key==='Enter'||event.key===' '){
    event.preventDefault();
    event.currentTarget.click();
  }
});
applyDisplay();
</script></body></html>
