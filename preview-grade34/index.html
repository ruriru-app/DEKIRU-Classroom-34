<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8bb7e8">
  <title>DEKIRU Classroom for Grade 3 &amp; 4</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <header class="app-header" id="app-header">
    <a class="brand" href="#/" aria-label="トップへ戻る">

      <span class="edition">for Grade 3 &amp; 4</span>

    <nav class="header-actions" aria-label="共通メニュー">

  <main id="app" class="app-main" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/app-data.js"></script>
