<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interviewの準備 | DEKIRU Classroom</title><link rel="stylesheet" href="styles.css?v=a4eed2a172d9"><link rel="stylesheet" href="header-theme.css?v=4e4ec224a300"><link rel="stylesheet" href="card-share.css?v=efcef9e89338"><link rel="stylesheet" href="interview.css?v=2cfd25adc24c"></head>
<body class="classroom-grade34 interview-page">
<header class="app-header"><a class="brand" href="index.html#/" aria-label="トップへ戻る"><img src="assets/ui/branding/logo-grade34.svg" alt="DEKIRU Classroom"></a><nav class="header-actions"><a class="icon-button" href="index.html#/" aria-label="ホーム"><img src="assets/ui/originals/ホームアイコン.svg" alt=""></a><button class="icon-button" id="settings-button" type="button" aria-label="設定"><img src="assets/ui/originals/設定アイコン.svg" alt=""></button></nav></header>
<main class="interview-main"><div class="interview-heading"><button id="interviewBack" aria-label="戻る" type="button">戻る</button><h1>Interviewの準備</h1></div><p id="interviewError" role="alert"></p>
<div class="interview-columns" id="interviewTeacher" hidden>
<section class="interview-panel" aria-label="配信内容"><h2 id="presetTitle"></h2><p id="presetName"></p><p id="presetDescription"></p><p class="interview-question" id="presetQuestion"></p><div id="presetCards" class="interview-pictures"></div><h3>回答エリア</h3><div id="presetAreas" class="interview-areas"></div><p>内容の変更はCreate Gamesで行います。</p></section>
<section class="interview-panel" aria-label="名簿の準備"><h2>クラスと名前の表示</h2><p>クラス設定で登録した名簿を使います。</p><label class="interview-field">保存したクラス<select id="rosterSelect"><option value="">クラスを選んでください</option></select></label><a id="rosterSettings" href="class-settings.html">クラスを登録・編集</a><div class="roster-display-options"><label class="interview-field">名前の表記<select id="rosterScript"><option value="kanji">漢字</option><option value="hiragana">ひらがな</option><option value="english">英語</option></select></label><label class="interview-field">表示範囲<select id="rosterScope"><option value="full">苗字＋名前</option><option value="given">名前のみ</option></select></label></div><p>出席番号は名前と一緒に表示します。</p><p id="rosterCount"></p><p id="rosterWarnings" aria-live="polite"></p><div id="rosterRows" class="interview-roster roster-preview" aria-label="配信する名簿"></div><p id="rosterStatus" role="status" aria-live="polite"></p>
<div class="interview-privacy"><p>このURLを知る人は名簿を閲覧できます。クラス内だけで共有し、公開ページやSNSに貼らないでください。暗号化・アクセス制限はありません。</p><label><input id="rosterConsent" type="checkbox">このURLには名簿が含まれることを確認しました</label></div><p id="rosterDirty"></p><button class="primary-button" id="interviewSend" type="button" disabled>この内容で配信</button><p>第１工程：児童側は受信確認用の仮画面です。</p>
</section></div></main>
