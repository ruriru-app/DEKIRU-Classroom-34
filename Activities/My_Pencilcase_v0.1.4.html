#activitySvg tspan {

}

<script>
const svg = document.getElementById('activitySvg');
const MARKER = '#d9d9d9';

const colorInfo = [
  ['color-white','white'],
  ['color-red','red'],
  ['color-orange','orange'],
  ['color-yellow','yellow'],
  ['color-green','green'],
  ['color-pink','pink'],
  ['color-purple','purple'],
  ['color-brown','brown'],
  ['color-black','black'],
  ['color-blue','blue'],
  ['color-light-blue','light blue'],
  ['color-yellow-green','yellow green'],
  ['color-gold','gold'],
  ['color-silver','silver']
];

const stationery = {
  '定規':'ruler',
  '消しゴム':'eraser',
  '鉛筆削り':'pencil sharpener',
  '鉛筆':'pencil',
  '色鉛筆':'colored pencil',
  'ペン':'pen',
  'のり':'glue'
};

let selectedColor = '#8BB7E8';
let selectedObject = null;
let audioOn = true;
let addCount = 0;

function pointInSvg(clientX,clientY){
  const p=svg.createSVGPoint();
  p.x=clientX;p.y=clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function speak(text){
  if(!audioOn || !text || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';
  u.rate=.9;
  speechSynthesis.speak(u);
}

function markColorable(root){
  root.querySelectorAll('[fill]').forEach(el=>{
    if((el.getAttribute('fill')||'').toLowerCase()===MARKER){
      el.dataset.colorable='1';
    }
  });
}

function recolor(root,color){
  root.querySelectorAll('[data-colorable="1"]').forEach(el=>el.setAttribute('fill',color));
}
function restoreMarkerColor(root){
  root.querySelectorAll('[data-colorable="1"]').forEach(el=>el.setAttribute('fill', MARKER));
}

function restorePaletteSelection(){
  colorInfo.forEach(([id])=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.setAttribute('stroke',el.dataset.baseStroke || 'none');
    el.setAttribute('stroke-width',el.dataset.baseStrokeWidth || '0');
  });

  selectedColor='#8BB7E8';
  const blue=document.getElementById('color-blue');
  if(blue){
    blue.setAttribute('stroke','#6B5746');
    blue.setAttribute('stroke-width','20');
  }
}

function selectObject(obj){
  svg.querySelectorAll('.selected-object').forEach(el=>el.classList.remove('selected-object'));
  selectedObject=obj;
  if(obj) obj.classList.add('selected-object');
}

function setupPalette(){
  colorInfo.forEach(([id,name])=>{
    const el=document.getElementById(id);
    if(!el) return;

    // 元の枠線を保存。白はSVG側の薄い枠をそのまま維持。
    el.dataset.baseStroke = el.getAttribute('stroke') || 'none';
    el.dataset.baseStrokeWidth = el.getAttribute('stroke-width') || '0';

    el.addEventListener('click',e=>{
      e.stopPropagation();

      colorInfo.forEach(([otherId])=>{
        const other=document.getElementById(otherId);
        if(!other) return;
        other.setAttribute('stroke',other.dataset.baseStroke || 'none');
        other.setAttribute('stroke-width',other.dataset.baseStrokeWidth || '0');
      });

      // 黒だけはオレンジ系の選択枠。他は濃いブラウン。
      el.setAttribute('stroke',name==='black' ? '#FFB463' : '#6B5746');
      el.setAttribute('stroke-width','20');

      selectedColor=(el.getAttribute('fill')||'#8BB7E8');
      speak(name);
    });
  });

  // 初期選択は blue
  const blue=document.getElementById('color-blue');
  if(blue){
    blue.setAttribute('stroke','#6B5746');
    blue.setAttribute('stroke-width','20');
  }
}

function addStationery(id){
  const src=document.getElementById(id);
  const pc=document.getElementById('筆箱');
  if(!src || !pc) return;

  const clone=src.cloneNode(true);
  clone.removeAttribute('id');
  clone.classList.add('placed-item');
  clone.dataset.source=id;

  // 後から何度でも色変更できるよう、着色前に対象部位を記録。
  markColorable(clone);
  recolor(clone,selectedColor);

  const sb=src.getBBox();
  const pb=pc.getBBox();

  // 筆箱の左半分寄りへ、元SVG倍率を一切変えずに配置。
  const cols=3;
  const col=addCount%cols;
  const row=Math.floor(addCount/cols)%3;
  addCount++;
  const targetX=pb.x + pb.width*(0.24 + col*0.16);
  const targetY=pb.y + pb.height*(0.30 + row*0.18);

  const dx=targetX-(sb.x+sb.width/2);
  const dy=targetY-(sb.y+sb.height/2);
  clone.dataset.tx=dx;
  clone.dataset.ty=dy;

  const baseTransform=clone.getAttribute('transform')||'';
  clone.dataset.baseTransform=baseTransform;
  clone.setAttribute('transform',`translate(${dx} ${dy}) ${baseTransform}`);

  const uiLayer=document.getElementById('レイヤー-2');
  if(uiLayer) uiLayer.parentNode.insertBefore(clone,uiLayer);
  else svg.appendChild(clone);

  enableDrag(clone);
  selectObject(clone);
  speak(stationery[id]);
}

function enableDrag(item){
  item.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    selectObject(item);
    item.setPointerCapture(e.pointerId);

    const start=pointInSvg(e.clientX,e.clientY);
    const startTx=Number(item.dataset.tx||0);
    const startTy=Number(item.dataset.ty||0);
    const base=item.dataset.baseTransform||'';

    const move=ev=>{
      const p=pointInSvg(ev.clientX,ev.clientY);
      const tx=startTx+(p.x-start.x);
      const ty=startTy+(p.y-start.y);
      item.dataset.tx=tx;
      item.dataset.ty=ty;
      item.setAttribute('transform',`translate(${tx} ${ty}) ${base}`);
    };
    const end=()=>{
      item.removeEventListener('pointermove',move);
      item.removeEventListener('pointerup',end);
      item.removeEventListener('pointercancel',end);
    };

    item.addEventListener('pointermove',move);
    item.addEventListener('pointerup',end);
    item.addEventListener('pointercancel',end);
  });

  item.addEventListener('click',e=>{
    e.stopPropagation();
    selectObject(item);
    recolor(item, selectedColor);
    speak(stationery[item.dataset.source]||'');
  });
}

function setupStationery(){
  Object.entries(stationery).forEach(([id,word])=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      addStationery(id);
    });
  });
}

function setupPencilCase(){
  const pc=document.getElementById('筆箱');
  if(!pc) return;
  markColorable(pc);
  pc.addEventListener('click',e=>{
    e.stopPropagation();
    selectObject(pc);
    recolor(pc, selectedColor);
    speak('pencil case');
  });
}

function setupTitles(){
  document.getElementById('title-colors-bg')?.addEventListener('click',e=>{e.stopPropagation();speak('Colors')});
  document.getElementById('title-stationaries-bg')?.addEventListener('click',e=>{e.stopPropagation();speak('Stationaries')});
  document.getElementById('title-my-pencilcase-bg')?.addEventListener('click',e=>{e.stopPropagation();speak('My Pencilcase')});
}

function setupButtons(){
  document.getElementById('delete-bg')?.addEventListener('click',e=>{
    e.stopPropagation();
    if(selectedObject?.classList.contains('placed-item')){
      selectedObject.remove();
      selectedObject=null;
    }
  });

  document.getElementById('reset-bg')?.addEventListener('click',e=>{
    e.stopPropagation();

    // 追加した文房具をすべて削除
    svg.querySelectorAll('.placed-item').forEach(el=>el.remove());

    // 筆箱の色を開始時の着色可能色（#D9D9D9）へ戻す
    const pc=document.getElementById('筆箱');
    if(pc) restoreMarkerColor(pc);

    // 色選択も開始時の blue に戻す
    restorePaletteSelection();

    // 選択状態・配置カウントを初期化
    selectObject(null);
    addCount=0;
  });

  const audioBg=document.getElementById('audio-bg');
  if(audioBg){
    audioBg.addEventListener('click',e=>{
      e.stopPropagation();
      audioOn=!audioOn;

      document.getElementById('audio-off-overlay')?.remove();

      if(!audioOn){
        if('speechSynthesis' in window) speechSynthesis.cancel();

        // SVGの薄いグリーン領域と完全に同じ形を複製してグレーアウト。
        const overlay=audioBg.cloneNode(true);
        overlay.id='audio-off-overlay';
        overlay.setAttribute('fill','#BFC3C7');
        overlay.setAttribute('opacity','.78');
        overlay.setAttribute('stroke','none');
        overlay.style.pointerEvents='none';

        audioBg.parentNode.insertBefore(overlay,audioBg.nextSibling);

        // 斜線は同じ領域のBBoxから自動生成。
        const b=audioBg.getBBox();
        const line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.id='audio-off-line';
        line.setAttribute('x1',b.x+b.width*.20);
        line.setAttribute('y1',b.y+b.height*.18);
        line.setAttribute('x2',b.x+b.width*.80);
        line.setAttribute('y2',b.y+b.height*.82);
        line.setAttribute('stroke','#6B5746');
        line.setAttribute('stroke-width',Math.max(18,b.height*.09));
        line.setAttribute('stroke-linecap','round');
        line.style.pointerEvents='none';
        audioBg.parentNode.appendChild(line);
      }else{
        document.getElementById('audio-off-line')?.remove();
      }
    });
  }
}

svg.addEventListener('click',()=>selectObject(null));

window.addEventListener('load',()=>{
  requestAnimationFrame(()=>{
    setupPalette();
    setupStationery();
    setupPencilCase();
    setupTitles();
    setupButtons();
    if('speechSynthesis' in window) speechSynthesis.getVoices();
  });
});

// Make taps on label glyphs behave exactly like taps on their surrounding control.
const interactiveIds = [
  'カラーパレット','筆箱','箱','鉛筆','色鉛筆','のり','定規','ペン','消しゴム','鉛筆削り',
  'calendar','notebook','magnet','marker','Stapler',
  'title-colors-bg','title-stationaries-bg','title-my-pencilcase-bg','title-main-bg',
  'delete-bg','reset-bg','audio-bg'
];
interactiveIds.forEach(id => {
  const root = document.getElementById(id);
  if (!root) return;
  root.querySelectorAll('text,tspan').forEach(el => el.style.pointerEvents='none');
});

</script>
</body>
